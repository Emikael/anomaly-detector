name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

# A superseded push should not keep a runner (and a Docker daemon) busy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The smoke test owns containers; without a cap a hang burns the 360-minute default.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven reactor
        run: ./mvnw -B verify

      - name: Run detection mutation gate
        run: ./mvnw -B -pl consumer -Pmutation org.pitest:pitest-maven:mutationCoverage

      - name: Run end-to-end smoke test
        run: ./scripts/smoke-test.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            consumer/target/pit-reports/**
