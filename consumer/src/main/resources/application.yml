server:
  port: ${CONSUMER_HTTP_PORT:8080}

spring:
  application:
    name: anomaly-detector-consumer
  profiles:
    active: ${LOG_FORMAT:plain}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated

detector:
  window-size: ${DETECTOR_WINDOW_SIZE:50}
  z-threshold: ${DETECTOR_Z_THRESHOLD:3.0}
  min-samples: ${DETECTOR_MIN_SAMPLES:30}
  exclude-anomalies: ${DETECTOR_EXCLUDE_ANOMALIES:true}
  consecutive-override: ${DETECTOR_CONSECUTIVE_OVERRIDE:5}
  summary-every: ${DETECTOR_SUMMARY_EVERY:100}

app:
  logging:
    format: ${LOG_FORMAT:plain}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,rabbit
        liveness:
          include: livenessState
